<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Calculadora básica</title>
</head>
<body>
    <main id="container">
        <section class="base-calculadora">
            <div class="calculadora">
                <div id="resultado">
                    <p id="info">Aguardando cálculo...</p>
                    <p id="res"></p>
                </div>

                <div class="botoes-calc">
                    <button value="0" class="botao-num btn1 botao">0</button>
                    <button value="1" class="botao-num btn2 botao">1</button>
                    <button value="2" class="botao-num btn3 botao">2</button>
                    <button value="3" class="botao-num btn4 botao">3</button>
                    <button value="4" class="botao-num btn5 botao">4</button>
                    <button value="5" class="botao-num btn6 botao">5</button>
                    <button value="6" class="botao-num btn7 botao">6</button>
                    <button value="7" class="botao-num btn8 botao">7</button>
                    <button value="8" class="botao-num btn9 botao">8</button>
                    <button value="9" class="botao-num btn10 botao">9</button>
                    <button value="=" class="botao-opera btn11 botao">=</button>
                    <button value="+" class="botao-opera btn12 botao">+</button>
                    <button value="-" class="botao-opera btn13 botao">-</button>
                    <button value="x" class="botao-opera btn14 botao">x</button>
                    <button value="/" class="botao-opera btn15 botao">/</button>
                    <button value="AC" class="btn16 botao">AC</button>
                    <button value="," class="botao-num btn17 botao">,</button>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/script.js"></script>
</body>
</html>
