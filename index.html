<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Calculadora básica</title>
</head>
<body>
    <main id="container">
        <section class="base-calculadora">
            <div class="calculadora">
                <div id="resultado"></div>

                <div class="botoes-calc">
                    <button class="botao-num btn1">0</button>
                    <button class="botao-num btn2">1</button>
                    <button class="botao-num btn3">2</button>
                    <button class="botao-num btn4">3</button>
                    <button class="botao-num btn5">4</button>
                    <button class="botao-num btn6">5</button>
                    <button class="botao-num btn7">6</button>
                    <button class="botao-num btn8">7</button>
                    <button class="botao-num btn9">8</button>
                    <button class="botao-num btn10">9</button>
                    <button class="botao-opera btn11">=</button>
                    <button class="botao-opera btn12">+</button>
                    <button class="botao-opera btn13">-</button>
                    <button class="botao-opera btn14">x</button>
                    <button class="botao-opera btn15">/</button>
                    <button class="btn16">AC</button>
                    <button class="botao-num btn17">.</button>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/script.js"></script>
</body>
</html>
